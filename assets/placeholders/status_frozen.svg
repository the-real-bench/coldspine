<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- FROZEN (S_FROZEN) #BFEFFF — solid ice cube (filled, heavier than Chilled) -->
  <rect x="1" y="1" width="22" height="22" rx="5" fill="#BFEFFF" stroke="#0B0E11" stroke-width="2"/>
  <!-- iso ice cube -->
  <polygon points="12,4 19,8 19,16 12,20 5,16 5,8" fill="#F2F4F6" stroke="#0B0E11" stroke-width="1.4"/>
  <polygon points="12,4 19,8 12,12 5,8" fill="#E0F6FF" stroke="#0B0E11" stroke-width="1"/>
  <line x1="12" y1="12" x2="12" y2="20" stroke="#0B0E11" stroke-width="1"/>
  <!-- frost sheen -->
  <line x1="8" y1="10" x2="9" y2="15" stroke="#8FD4E8" stroke-width="1"/>
</svg>
