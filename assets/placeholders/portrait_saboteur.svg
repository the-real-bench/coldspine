<svg viewBox="0 0 140 180" xmlns="http://www.w3.org/2000/svg">
  <!-- SABOTEUR draft portrait (W5-1). Character art layer (NOT the 64px board token).
       Bible §3.5 player cyan wash + electric-yellow accent #FFE14D. Wiry, goggles + gear. -->
  <rect x="0" y="0" width="140" height="180" fill="#0B0E11"/>
  <rect x="0" y="0" width="140" height="180" fill="#2EA7E0" opacity="0.07"/>
  <!-- wiry shoulders / torso -->
  <polygon points="70,80 100,98 102,180 38,180 40,98" fill="#2A3038" stroke="#0B0E11" stroke-width="3"/>
  <!-- neck -->
  <rect x="60" y="66" width="20" height="18" fill="#2A3038" stroke="#0B0E11" stroke-width="2"/>
  <!-- head -->
  <circle cx="70" cy="46" r="21" fill="#2A3038" stroke="#0B0E11" stroke-width="3"/>
  <!-- goggles -->
  <rect x="52" y="40" width="36" height="10" rx="4" fill="#FFE14D" stroke="#0B0E11" stroke-width="2"/>
  <!-- antenna node -->
  <line x1="70" y1="25" x2="70" y2="10" stroke="#FFE14D" stroke-width="3"/>
  <circle cx="70" cy="8" r="4" fill="#FFE14D"/>
  <!-- gear glyph on chest -->
  <circle cx="70" cy="128" r="14" fill="none" stroke="#FFE14D" stroke-width="4"/>
  <circle cx="70" cy="128" r="5" fill="#FFE14D"/>
</svg>
