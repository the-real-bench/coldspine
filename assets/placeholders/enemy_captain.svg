  <circle cx="48" cy="48" r="38" fill="none" stroke="#E0432E" stroke-width="2" opacity="0.7"/>
  <!-- imposing body -->
  <polygon points="48,22 72,36 70,68 26,68 24,36" fill="#4A2A2A" stroke="#0B0E11" stroke-width="2.5"/>
  <circle cx="48" cy="33" r="10" fill="#4A2A2A" stroke="#0B0E11" stroke-width="2"/>
  <!-- gold rank chevron -->
  <polygon points="48,44 60,52 48,50 36,52" fill="#C9A24A" stroke="#0B0E11" stroke-width="1.5"/>
  <polygon points="48,52 60,60 48,58 36,60" fill="#C9A24A" stroke="#0B0E11" stroke-width="1.5"/>
