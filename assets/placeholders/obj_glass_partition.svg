  <rect x="22" y="18" width="52" height="60" rx="2" fill="none" stroke="#9AA3AD" stroke-width="4"/>
  <!-- frosted pane -->
  <rect x="26" y="22" width="44" height="52" fill="#B6C6CE" opacity="0.5"/>
  <!-- glass highlight streaks -->
  <line x1="34" y1="24" x2="30" y2="72" stroke="#E8FBFF" stroke-width="2" opacity="0.7"/>
  <line x1="50" y1="24" x2="46" y2="72" stroke="#E8FBFF" stroke-width="1.5" opacity="0.5"/>
  <!-- pre-crack hint -->
  <polyline points="48,40 56,48 50,56 58,64" fill="none" stroke="#8FA0A8" stroke-width="1.2" opacity="0.8"/>
  <!-- integrity pips -->
  <g fill="#9AA3AD"><rect x="32" y="82" width="9" height="4"/><rect x="44" y="82" width="9" height="4"/></g>
</svg>
