<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- SENTRY TURRET (enemy). Bible §3.5 red ring + Engine steel. Static, destructible — twin barrels + eye. -->
  <circle cx="48" cy="48" r="44" fill="#E0432E" opacity="0.14"/>
  <circle cx="48" cy="48" r="44" fill="none" stroke="#E0432E" stroke-width="4"/>
  <!-- base -->
  <ellipse cx="48" cy="68" rx="22" ry="9" fill="#222A32" stroke="#0B0E11" stroke-width="2"/>
  <!-- turret head -->
  <rect x="32" y="38" width="32" height="22" rx="4" fill="#2C3640" stroke="#0B0E11" stroke-width="2"/>
  <!-- targeting eye -->
  <circle cx="48" cy="49" r="6" fill="#FF3B3B" stroke="#0B0E11" stroke-width="1.5"/>
  <circle cx="48" cy="49" r="2" fill="#FFD0D0"/>
  <!-- twin barrels -->
  <rect x="64" y="42" width="22" height="4" rx="1" fill="#6A6A72" stroke="#0B0E11" stroke-width="1"/>
  <rect x="64" y="50" width="22" height="4" rx="1" fill="#6A6A72" stroke="#0B0E11" stroke-width="1"/>
</svg>
