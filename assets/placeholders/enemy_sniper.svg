<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- SNIPER (enemy). Bible §3.5 red ring. Overwatch threat — very long rifle + red laser dot. -->
  <circle cx="48" cy="48" r="44" fill="#E0432E" opacity="0.14"/>
  <circle cx="48" cy="48" r="44" fill="none" stroke="#E0432E" stroke-width="4"/>
  <ellipse cx="40" cy="54" rx="12" ry="19" fill="#3A2A2A" stroke="#0B0E11" stroke-width="2"/>
  <circle cx="40" cy="37" r="8" fill="#3A2A2A" stroke="#0B0E11" stroke-width="2"/>
  <!-- very long rifle -->
  <rect x="26" y="46" width="58" height="4" rx="1" transform="rotate(-14 55 48)" fill="#6A6A72" stroke="#0B0E11" stroke-width="1.5"/>
  <!-- red laser sight line + dot -->
  <line x1="74" y1="34" x2="90" y2="28" stroke="#FF3B3B" stroke-width="1.5" opacity="0.85"/>
  <circle cx="90" cy="28" r="3" fill="#FF3B3B"/>
</svg>
