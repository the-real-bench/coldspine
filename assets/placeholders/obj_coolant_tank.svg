<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- COOLANT TANK (object). onBreak: FLOOD (radius 3). Industrial steel cylinder, blue coolant + frost rime. -->
  <ellipse cx="48" cy="22" rx="18" ry="6" fill="#6E7B86" stroke="#9AA3AD" stroke-width="2.5"/>
  <path d="M30,22 L30,72 a18,6 0 0 0 36,0 L66,22" fill="#5A6470" stroke="#9AA3AD" stroke-width="2.5"/>
  <path d="M30,22 L30,72 a18,6 0 0 0 36,0 L66,22" fill="none" stroke="#0B0E11" stroke-width="1"/>
  <!-- blue coolant level window -->
  <rect x="40" y="34" width="16" height="34" rx="2" fill="#2E8BC0" opacity="0.7" stroke="#0B0E11" stroke-width="1"/>
  <line x1="40" y1="42" x2="56" y2="42" stroke="#7EC8E3" stroke-width="2"/>
  <!-- frost rime at top -->
  <path d="M32,26 l4,-4 4,4 4,-4 4,4 4,-4 4,4 4,-4" fill="none" stroke="#BFEFFF" stroke-width="1.5"/>
  <!-- steel band -->
  <path d="M30,50 a18,6 0 0 0 36,0" fill="none" stroke="#9AA3AD" stroke-width="3"/>
  <!-- stress crack (floodable tell) -->
  <polyline points="48,30 52,44 46,56 52,66" fill="none" stroke="#E8FBFF" stroke-width="1.3"/>
  <!-- integrity pips -->
  <g fill="#9AA3AD"><rect x="36" y="82" width="7" height="4"/><rect x="45" y="82" width="7" height="4"/><rect x="54" y="82" width="7" height="4"/></g>
</svg>
