<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- GAS MAIN (object, anchored). onBreak: spill POISON_GAS. Pipe + valve + sickly green gas + warning. -->
  <rect x="10" y="44" width="76" height="20" rx="4" fill="#5A6470" stroke="#9AA3AD" stroke-width="2.5"/>
  <rect x="10" y="44" width="76" height="20" rx="4" fill="none" stroke="#0B0E11" stroke-width="1"/>
  <rect x="22" y="40" width="6" height="28" fill="#6E7B86" stroke="#0B0E11" stroke-width="1"/>
  <rect x="68" y="40" width="6" height="28" fill="#6E7B86" stroke="#0B0E11" stroke-width="1"/>
  <!-- valve -->
  <circle cx="48" cy="32" r="11" fill="none" stroke="#9AA3AD" stroke-width="3"/>
  <line x1="38" y1="32" x2="58" y2="32" stroke="#9AA3AD" stroke-width="2"/>
  <line x1="48" y1="22" x2="48" y2="44" stroke="#9AA3AD" stroke-width="2"/>
  <!-- green gas puffs escaping (the poison tell) -->
  <circle cx="34" cy="22" r="8" fill="#7FBF3F" opacity="0.45"/>
  <circle cx="62" cy="20" r="9" fill="#7FBF3F" opacity="0.45"/>
  <circle cx="48" cy="14" r="7" fill="#7FBF3F" opacity="0.45"/>
  <!-- warning triangle on pipe -->
  <polygon points="48,50 55,61 41,61" fill="#FFD08A" stroke="#0B0E11" stroke-width="1"/>
  <rect x="47" y="53" width="2" height="4" fill="#0B0E11"/>
  <rect x="47" y="58" width="2" height="2" fill="#0B0E11"/>
  <!-- integrity pips -->
  <g fill="#9AA3AD"><rect x="38" y="84" width="7" height="4"/><rect x="47" y="84" width="7" height="4"/><rect x="56" y="84" width="7" height="4"/></g>
</svg>
