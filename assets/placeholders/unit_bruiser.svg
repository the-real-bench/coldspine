<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- BRUISER (player) board token. W5-18 redraw: reads as a HEAVY PERSON at 64px (head + broad
       shoulders + torso), not a boxy glyph. Bible §3.5 cyan ring #2EA7E0 + rust accent #C26A2A. -->
  <circle cx="48" cy="48" r="44" fill="#2EA7E0" opacity="0.18"/>
  <circle cx="48" cy="48" r="44" fill="none" stroke="#2EA7E0" stroke-width="4"/>
  <!-- broad shoulders + torso (a person, front-on, hunched heavy) -->
  <path d="M28,86 Q26,54 34,50 Q30,44 30,38 Q30,26 48,26 Q66,26 66,38 Q66,44 62,50 Q70,54 68,86 Z"
        fill="#2A3038" stroke="#0B0E11" stroke-width="2.5"/>
  <!-- head -->
  <circle cx="48" cy="24" r="12" fill="#2A3038" stroke="#0B0E11" stroke-width="2.5"/>
  <!-- heavy brow -->
  <rect x="40" y="20" width="16" height="4" rx="1" fill="#C26A2A"/>
  <!-- big fists (the displacement engine) -->
  <circle cx="30" cy="66" r="9" fill="#C26A2A" stroke="#0B0E11" stroke-width="2.5"/>
  <circle cx="66" cy="66" r="9" fill="#C26A2A" stroke="#0B0E11" stroke-width="2.5"/>
</svg>
