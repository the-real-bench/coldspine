<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- CHANDELIER (object, heavy, no cover). onBreak: TOPPLE straight DOWN (falls on whoever's below). Gold #C9A24A. -->
  <line x1="48" y1="6" x2="48" y2="24" stroke="#5A6470" stroke-width="2"/>
  <ellipse cx="48" cy="34" rx="30" ry="10" fill="none" stroke="#C9A24A" stroke-width="3"/>
  <ellipse cx="48" cy="34" rx="16" ry="5" fill="none" stroke="#C9A24A" stroke-width="2"/>
  <!-- candle arms -->
  <g fill="#C9A24A" stroke="#0B0E11" stroke-width="1">
    <rect x="16" y="28" width="4" height="8"/><rect x="44" y="26" width="4" height="8"/><rect x="76" y="28" width="4" height="8"/>
  </g>
  <!-- flame dots -->
  <g fill="#FFD08A"><circle cx="18" cy="26" r="2.5"/><circle cx="46" cy="24" r="2.5"/><circle cx="78" cy="26" r="2.5"/></g>
  <!-- drop crystals -->
  <g fill="#E8FBFF" opacity="0.85"><polygon points="32,40 35,48 29,48"/><polygon points="48,42 51,52 45,52"/><polygon points="64,40 67,48 61,48"/></g>
  <g fill="#9AA3AD"><rect x="40" y="86" width="7" height="4"/><rect x="49" y="86" width="7" height="4"/></g>
</svg>
