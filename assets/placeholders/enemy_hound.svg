<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- HOUND (enemy). Bible §3.5 red ring. Fast flanker — low elongated body + speed streak. -->
  <circle cx="48" cy="48" r="44" fill="#E0432E" opacity="0.14"/>
  <circle cx="48" cy="48" r="44" fill="none" stroke="#E0432E" stroke-width="4"/>
  <!-- low crouched elongated body -->
  <ellipse cx="50" cy="56" rx="24" ry="12" fill="#3A2A2A" stroke="#0B0E11" stroke-width="2"/>
  <!-- head forward -->
  <polygon points="70,52 84,50 80,60 70,62" fill="#3A2A2A" stroke="#0B0E11" stroke-width="2"/>
  <!-- ears -->
  <polygon points="72,50 76,42 80,50" fill="#3A2A2A" stroke="#0B0E11" stroke-width="1.5"/>
  <!-- speed streaks (flanker tell) -->
  <line x1="18" y1="50" x2="34" y2="50" stroke="#E0432E" stroke-width="2.5" opacity="0.8"/>
  <line x1="16" y1="58" x2="30" y2="58" stroke="#E0432E" stroke-width="2" opacity="0.6"/>
</svg>
