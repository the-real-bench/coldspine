<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- CAPTAIN: The Tail Warden (S1) — unshovable_until_soaked. Key tell = SOAK (blue). Heavy melee/slam. -->
  <circle cx="48" cy="48" r="44" fill="#E0432E" opacity="0.16"/>
  <circle cx="48" cy="48" r="44" fill="none" stroke="#E0432E" stroke-width="4"/>
  <circle cx="48" cy="48" r="38" fill="none" stroke="#E0432E" stroke-width="2" opacity="0.7"/>
  <!-- maul (left) -->
  <rect x="20" y="30" width="8" height="42" rx="3" transform="rotate(-12 24 50)" fill="#6E6E76" stroke="#0B0E11" stroke-width="2"/>
  <rect x="15" y="25" width="17" height="13" rx="2" transform="rotate(-12 24 31)" fill="#8A8A92" stroke="#0B0E11" stroke-width="2"/>
  <!-- broad warden body -->
  <polygon points="50,22 74,36 72,70 30,70 28,36" fill="#3A2E2E" stroke="#0B0E11" stroke-width="2.5"/>
  <circle cx="50" cy="34" r="11" fill="#3A2E2E" stroke="#0B0E11" stroke-width="2"/>
  <!-- gold rank -->
  <polygon points="50,46 62,54 50,52 38,54" fill="#C9A24A" stroke="#0B0E11" stroke-width="1.5"/>
  <polygon points="50,54 62,62 50,60 38,62" fill="#C9A24A" stroke="#0B0E11" stroke-width="1.5"/>
  <!-- SOAK key mote -->
  <circle cx="72" cy="22" r="7" fill="#2E8BC0" stroke="#0B0E11" stroke-width="1.5"/>
  <path d="M72 17 q4 5 0 7 q-4 -2 0 -7 Z" fill="#F2F4F6"/>
