<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- WATER MAIN (object, anchored). onBreak: FLOOD (radius 4). Big pipe + valve wheel, blue leak tell. -->
  <rect x="10" y="40" width="76" height="20" rx="4" fill="#5A6470" stroke="#9AA3AD" stroke-width="2.5"/>
  <rect x="10" y="40" width="76" height="20" rx="4" fill="none" stroke="#0B0E11" stroke-width="1"/>
  <!-- flanges -->
  <rect x="22" y="36" width="6" height="28" fill="#6E7B86" stroke="#0B0E11" stroke-width="1"/>
  <rect x="68" y="36" width="6" height="28" fill="#6E7B86" stroke="#0B0E11" stroke-width="1"/>
  <!-- valve wheel -->
  <circle cx="48" cy="28" r="12" fill="none" stroke="#9AA3AD" stroke-width="3"/>
  <rect x="46" y="28" width="4" height="14" fill="#5A6470" stroke="#0B0E11" stroke-width="1"/>
  <line x1="36" y1="28" x2="60" y2="28" stroke="#9AA3AD" stroke-width="2"/>
  <line x1="48" y1="16" x2="48" y2="40" stroke="#9AA3AD" stroke-width="2"/>
  <!-- blue water leak (the floodable tell) -->
  <path d="M48,60 q-3,8 0,16 M44,60 q-2,6 -1,12 M52,60 q2,6 1,12" fill="none" stroke="#2E8BC0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- integrity pips -->
  <g fill="#9AA3AD"><rect x="38" y="84" width="7" height="4"/><rect x="47" y="84" width="7" height="4"/><rect x="56" y="84" width="7" height="4"/></g>
</svg>
