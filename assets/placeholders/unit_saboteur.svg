<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- SABOTEUR (player). Bible §3.5 cyan ring #2EA7E0 + electric-yellow accent #FFE14D. Gear + antenna. -->
  <circle cx="48" cy="48" r="44" fill="#2EA7E0" opacity="0.18"/>
  <circle cx="48" cy="48" r="44" fill="none" stroke="#2EA7E0" stroke-width="4"/>
  <!-- wiry body -->
  <ellipse cx="48" cy="52" rx="13" ry="20" fill="#2A3038" stroke="#0B0E11" stroke-width="2"/>
  <circle cx="48" cy="36" r="9" fill="#2A3038" stroke="#0B0E11" stroke-width="2"/>
  <!-- antenna node -->
  <line x1="48" y1="27" x2="48" y2="16" stroke="#FFE14D" stroke-width="2"/>
  <circle cx="48" cy="14" r="3" fill="#FFE14D"/>
  <!-- gear glyph on chest -->
  <g fill="#FFE14D" stroke="#0B0E11" stroke-width="1">
    <circle cx="48" cy="52" r="8"/>
  </g>
  <circle cx="48" cy="52" r="3.5" fill="#2A3038"/>
  <!-- zigzag detonator spark -->
  <polyline points="58,62 64,58 60,66 66,62" fill="none" stroke="#FFE14D" stroke-width="2"/>
</svg>
