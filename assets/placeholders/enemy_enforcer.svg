<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- ENFORCER (enemy). Bible §3.5 red ring. Armored ranged — heavy pauldrons + carbine. -->
  <circle cx="48" cy="48" r="44" fill="#E0432E" opacity="0.14"/>
  <circle cx="48" cy="48" r="44" fill="none" stroke="#E0432E" stroke-width="4"/>
  <!-- armored darker body -->
  <polygon points="48,24 70,36 68,66 28,66 26,36" fill="#4A2A2A" stroke="#0B0E11" stroke-width="2"/>
  <circle cx="48" cy="34" r="9" fill="#4A2A2A" stroke="#0B0E11" stroke-width="2"/>
  <!-- heavy pauldrons -->
  <ellipse cx="28" cy="40" rx="8" ry="6" fill="#6A4242" stroke="#0B0E11" stroke-width="1.5"/>
  <ellipse cx="68" cy="40" rx="8" ry="6" fill="#6A4242" stroke="#0B0E11" stroke-width="1.5"/>
  <!-- carbine -->
  <rect x="58" y="50" width="26" height="5" rx="1" fill="#8A8A92" stroke="#0B0E11" stroke-width="1.5"/>
</svg>
