<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- JUNCTION BOX (object, anchored). Bible §3.5 grey frame. Electrifies flood water (L_ELECTRIFIED). -->
  <rect x="26" y="24" width="44" height="48" rx="3" fill="#5A6470" stroke="#9AA3AD" stroke-width="3"/>
  <rect x="26" y="24" width="44" height="48" rx="3" fill="none" stroke="#0B0E11" stroke-width="1"/>
  <!-- yellow hazard zigzag mark -->
  <polyline points="36,34 50,34 42,48 56,48 40,64" fill="none" stroke="#FFE14D" stroke-width="3"/>
  <!-- exposed contacts -->
  <circle cx="34" cy="66" r="3" fill="#FFE14D" stroke="#0B0E11" stroke-width="1"/>
  <circle cx="62" cy="66" r="3" fill="#FFE14D" stroke="#0B0E11" stroke-width="1"/>
  <!-- arc between contacts -->
  <polyline points="34,66 44,62 40,70 50,66 62,66" fill="none" stroke="#E8FBFF" stroke-width="1.5"/>
</svg>
